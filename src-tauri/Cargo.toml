[package]
name = "swatlas"
description = "Shortwave Atlas desktop app"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1.92"
atlas-core = { path = "../crates/atlas-core" }
atlas-server = { path = "../crates/atlas-server" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-opener = "2.7.0"
# No `zip`: it only unpacks Tauri v1 `.zip`/`.tar.gz` update bundles, and we ship v2 ones
# (`createUpdaterArtifacts: true`). Dropping it removes `zip` 4 (RUSTSEC-2026-0369).
tauri-plugin-updater = { version = "2.13.2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tokio = { version = "1.53.2", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
