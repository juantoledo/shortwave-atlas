# rigctld and ffmpeg for the Windows and macOS installers (assets/sidecars/build.py).
# Cached by the script's hash: the pinned versions and build flags live in it.
name: Sidecars
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build from (the release tag); default the triggering one
        type: string
        default: ""
  workflow_dispatch:

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          # cross-compiled with MinGW-w64; Hamlib's own Windows build is downloaded
          - { target: x86_64-pc-windows-msvc, os: ubuntu-22.04 }
          - { target: universal-apple-darwin, os: macos-14 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/binaries
          key: sidecars-${{ matrix.target }}-${{ hashFiles('assets/sidecars/build.py') }}
      - name: MinGW-w64
        if: steps.cache.outputs.cache-hit != 'true' && matrix.target == 'x86_64-pc-windows-msvc'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 make
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: python3 assets/sidecars/build.py ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sidecars-${{ matrix.target }}
          path: src-tauri/binaries
