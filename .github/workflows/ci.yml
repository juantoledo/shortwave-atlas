# Build and test on the three desktop OSes. The per-OS rules are pure functions tested
# everywhere; this proves the OS-specific code also compiles and runs on its own OS.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Linux libraries (Tauri; ALSA for the audio capture; Hamlib for the real-rigctld test)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libhamlib-utils

      # Tauri checks that sidecars and resources exist even for a debug build; the real
      # ones are only built for releases (sidecars.yml).
      - name: Stub sidecars
        if: runner.os != 'Linux'
        shell: bash
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          mkdir -p src-tauri/binaries/windows src-tauri/binaries/licenses
          touch "src-tauri/binaries/rigctld-$host$ext"
          touch src-tauri/binaries/windows/stub.dll src-tauri/binaries/licenses/README

      - run: npm ci && npm --prefix ui ci
      - run: npm --prefix ui run build
      - run: cargo fmt --check
        if: runner.os == 'Linux'
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Generated TypeScript types are committed
        if: runner.os == 'Linux'
        run: git diff --exit-code -- ui/src/types/generated
      - run: npm --prefix ui run typecheck
      - run: npm --prefix ui test

  # Known vulnerabilities, licenses and sources of every dependency (deny.toml), and the UI's
  # runtime npm packages.
  dependencies:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      # A prebuilt binary from GitHub releases: the cargo-deny Docker action fails whenever
      # Docker Hub rate-limits the runners.
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --log-level warn --all-features check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm --prefix ui audit --omit=dev --audit-level=high

  # Commit messages decide the next version (release-please): feat, fix, feat!, chore, docs...
  commits:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # The commits a pull request adds, or the ones a push to main brings in.
      - name: Commit messages
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npx --no-install commitlint --from "$FROM" --to "$TO" --verbose
