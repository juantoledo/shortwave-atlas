# Build and test on the three desktop OSes. The per-OS rules are pure functions tested
# everywhere; this proves the OS-specific code also compiles and runs on its own OS.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Linux libraries (Tauri; Hamlib and ffmpeg for the real-program tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libhamlib-utils ffmpeg

      # Tauri checks that sidecars and resources exist even for a debug build; the real
      # ones are only built for releases (sidecars.yml).
      - name: Stub sidecars
        if: runner.os != 'Linux'
        shell: bash
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          mkdir -p src-tauri/binaries/windows src-tauri/binaries/licenses
          for b in rigctld ffmpeg; do touch "src-tauri/binaries/$b-$host$ext"; done
          touch src-tauri/binaries/windows/stub.dll src-tauri/binaries/licenses/README

      - run: npm ci && npm --prefix ui ci
      - run: npm --prefix ui run build
      - run: cargo fmt --check
        if: runner.os == 'Linux'
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Generated TypeScript types are committed
        if: runner.os == 'Linux'
        run: git diff --exit-code -- ui/src/types/generated
      - run: npm --prefix ui run typecheck
      - run: npm --prefix ui test

  # Known vulnerabilities, licenses and sources of every dependency (deny.toml), and the UI's
  # runtime npm packages.
  dependencies:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm --prefix ui audit --omit=dev --audit-level=high

  # Commit messages decide the next version (release-please): feat, fix, feat!, chore, docs...
  commits:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: wagoid/commitlint-github-action@6cf16efdf4da5277c791d335142c03a0bdf1766e # v6.2.1
        with:
          configFile: .commitlintrc.json
