# Build and test on the three desktop OSes. The per-OS rules are pure functions tested
# everywhere; this proves the OS-specific code also compiles and runs on its own OS.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Linux libraries (Tauri; Hamlib and ffmpeg for the real-program tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libhamlib-utils ffmpeg

      # Tauri checks that sidecars and resources exist even for a debug build; the real
      # ones are only built for releases (sidecars.yml).
      - name: Stub sidecars
        if: runner.os != 'Linux'
        shell: bash
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          mkdir -p src-tauri/binaries/windows src-tauri/binaries/licenses
          for b in rigctld ffmpeg; do touch "src-tauri/binaries/$b-$host$ext"; done
          touch src-tauri/binaries/windows/stub.dll src-tauri/binaries/licenses/README

      - run: npm ci && npm --prefix ui ci
      - run: npm --prefix ui run build
      - run: cargo fmt --check
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Generated TypeScript types are committed
        if: runner.os == 'Linux'
        run: git diff --exit-code -- ui/src/types/generated
      - run: npm --prefix ui run typecheck
      - run: npm --prefix ui test
