# Weekly dependency updates, grouped so each ecosystem is one PR. The commit prefix keeps
# them out of the version bump ("chore").
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
    groups:
      cargo: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: npm
    directories: [/, /ui]
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
    groups:
      npm: { patterns: ["*"], update-types: [minor, patch] }
