# cargo-deny: run in CI and before every release (`cargo deny check`).
# Known vulnerabilities fail everywhere; unmaintained or unsound crates only fail when we
# depend on them directly (Tauri's Linux stack pulls in the GTK3 bindings, which are
# unmaintained upstream and out of our hands).

[graph]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "workspace"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# our own path dependencies (the crates are `publish = false`)
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
