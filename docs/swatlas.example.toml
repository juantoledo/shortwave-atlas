# SW Atlas config: ~/.config/swatlas/swatlas.toml (or $SWATLAS_CONFIG).
# Shared by the desktop app and swatlas-server. Every key is optional.
# Environment overrides: SWATLAS_RIG, RIGCTLD_HOST, RIGCTLD_PORT, SWATLAS_RIG_MODEL,
# SWATLAS_RIG_DEVICE, SWATLAS_RIG_BAUD, WEB_BIND, WEB_PORT, WEB_AUTH, AUDIO_DEVICE,
# AUDIO_RATE, SWATLAS_LANG, SWATLAS_EIBI_DIR, SWATLAS_UI_DIR.

# lang = "es"                 # UI language; default follows the browser/OS
# eibi_dir = "/path/to/eibi"  # EiBi files laid out like data/eibi; default: the bundled schedule

[rig]
# "sim" (no hardware, default) | "external" (a rigctld already running) | "spawn" (start our own)
backend = "spawn"
model = 1042                  # FTDX10 (`rigctl -l`)
device = "/dev/serial/by-id/usb-Silicon_Labs_CP2105_Dual_USB_to_UART_Bridge_Controller_01A82072-if00-port0"
baud = 9600                   # must match the radio's CAT RATE menu
port = 4532                   # rigctld always listens on 127.0.0.1 only
# host = "127.0.0.1"          # external only
# rigctld = "rigctld"         # executable

[qth]                         # starting QTH; a click on the globe overrides it (saved in qth.json)
name = "Santiago, Chile"
lat = -33.45
lon = -70.67

[server]                      # remote browser UI (always on in swatlas-server)
enabled = false               # desktop app: also serve the remote UI
bind = "127.0.0.1"            # anything beyond loopback requires auth
port = 8080
# auth = "user:A_LONG_PASSWORD"

[audio]                       # rig audio, for the desktop app and remote browsers
enabled = false               # or pick the sound card in Settings → Audio
device = "plughw:CARD=CODEC,DEV=0"  # Linux (ALSA); Windows "Microphone (USB AUDIO  CODEC)", macOS "USB AUDIO  CODEC"
rate = 16000                  # 16-bit mono PCM: 16 kHz = 256 kbit/s per listener
# buffers and timing (Settings → Audio → Advanced); unset = these defaults
# cushion_ms = 120            # listener's cushion, rebuilt after a gap: raise it if Listen cuts out
# max_ahead_ms = 500          # most audio queued ahead of the listener; later blocks are dropped
# block_ms = 20               # audio per block sent to listeners
# queue_ms = 1000             # kept for a slow listener before the server drops blocks
# capture_rate = 48000        # rate asked of the card, before conversion to `rate`

[update]                      # "Update available": one small file from GitHub Pages, nothing about you is sent
check = true                  # at start and every 6 hours; or Settings → Updates (SWATLAS_UPDATE_CHECK=0)
channel = "stable"            # "beta" also offers release candidates
