[package]
name = "atlas-server"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = ["update-check"]
# HTTPS for `ManifestUpdater` (rustls + ring, which needs a C compiler for the target: the
# Windows/macOS cross-check turns it off).
update-check = ["dep:reqwest", "dep:rustls"]

[dependencies]
async-trait = "0.1.92"
atlas-core = { path = "../atlas-core" }
atlas-rig = { path = "../atlas-rig" }
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
bytes = "1.12.1"
dirs = "7.0.0"
futures-util = "0.3.34"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6.1"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.7"
toml_edit = "0.25.16"
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.30.0"
