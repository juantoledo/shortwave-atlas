[workspace]
resolver = "2"
members = ["crates/atlas-core", "crates/atlas-rig", "crates/atlas-server", "src-tauri"]
# src-tauri needs the webkit2gtk dev libraries; plain `cargo test` skips it.
default-members = ["crates/atlas-core", "crates/atlas-rig", "crates/atlas-server", "src-tauri"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.12.2"
# internal crates, never published to crates.io
publish = false

# Dependencies optimized in dev builds too: symphonia (NET audio) and rubato (resampling) are
# too slow unoptimized for real-time audio in `npm run dev`. Our own crates stay quick to build.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
